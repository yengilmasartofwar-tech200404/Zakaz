<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veb-ilova Buyurtma Berish</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Firebase SDK Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD7lFMqeIzoWZ-tuEByt-U1Zj6KaWFDr1s",
      authDomain: "bahadir-b268a.firebaseapp.com",
      projectId: "bahadir-b268a",
      storageBucket: "bahadir-b268a.firebasestorage.app",
      messagingSenderId: "397777392294",
      appId: "1:397777392294:web:359d70caee7db570795a67",
      measurementId: "G-M5KH60SWPM"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const tg = window.Telegram.WebApp;
    tg.expand();

    document.getElementById("orderForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const siteName = document.getElementById("siteName").value;
      const designStyle = document.getElementById("designStyle").value;
      const functionality = document.getElementById("functionality").value;
      const estimatedBudget = document.getElementById("budget").value;
      const rating = document.getElementById("rating").value;
      const isLiked = document.getElementById("isLiked").checked;

      const user = tg.initDataUnsafe?.user || { id: 0, first_name: "Demo", username: "demo_user" };

      const orderData = {
        userId: user.id,
        userName: user.first_name,
        userHandle: user.username || "mavjud emas",
        siteName: siteName,
        designStyle: designStyle,
        functionality: functionality,
        budget: Number(estimatedBudget),
        rating: Number(rating),
        isLiked: isLiked,
        status: "Yangi",
        createdAt: serverTimestamp()
      };

      try {
        // 1. Firebase Firestore bazasiga saqlash
        await addDoc(collection(db, "orders"), orderData);

        // 2. Telegram WebApp orqali botga ma'lumotni yuborish
        tg.sendData(JSON.stringify(orderData));
        tg.close();
      } catch (error) {
        alert("Xatolik yuz berdi: " + error.message);
      }
    });
  </script>

  <style>
    body { font-family: Arial, sans-serif; padding: 15px; background-color: #f4f7f6; color: #333; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background-color: #0088cc; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <h2>🚀 Yangi Veb-ilova Buyurtmasi</h2>
  <form id="orderForm">
    <div class="form-group">
      <label for="siteName">🌐 Sayt / Ilova nomi:</label>
      <input type="text" id="siteName" placeholder="Masalan: AvtoEski UZ" required>
    </div>

    <div class="form-group">
      <label for="designStyle">🎨 Dizayn uslubi:</label>
      <select id="designStyle">
        <option value="Minimalistik">Minimalistik va Zamonaviy</option>
        <option value="Korporativ">Korporativ / Biznes</option>
        <option value="Futuristik / Dark">Futuristik (To'q rangli)</option>
        <option value="E-Commerce">Internet Do'kon uslubida</option>
      </select>
    </div>

    <div class="form-group">
      <label for="functionality">⚙️ Sayt nima vazifa bajarishi kerak?</label>
      <textarea id="functionality" rows="3" placeholder="Masalan: Onlayn to'lov qabul qilishi, avtodrom testlari va SMS xabarnomalar berishi kerak." required></textarea>
    </div>

    <div class="form-group">
      <label for="budget">💰 Rejalashtirilgan byudjet ($):</label>
      <input type="number" id="budget" placeholder="150" required>
    </div>

    <div class="form-group">
      <label for="rating">⭐ Xizmat sifatiga bahoingiz (1-5):</label>
      <select id="rating">
        <option value="5">⭐⭐⭐⭐⭐ (5 - A'lo)</option>
        <option value="4">⭐⭐⭐⭐ (4 - Yaxshi)</option>
        <option value="3">⭐⭐⭐ (3 - Qoniqarli)</option>
      </select>
    </div>

    <div class="form-group">
      <label><input type="checkbox" id="isLiked" checked> Xizmatimiz sizga yoqdimi? 👍</label>
    </div>

    <button type="submit">Buyurtmani Yuborish</button>
  </form>
</body>
</html>
